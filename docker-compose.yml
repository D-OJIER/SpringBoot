version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db_micro_mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_micro_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpass" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ./micro-services
      dockerfile: auth-service/Dockerfile
    container_name: auth_service
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./micro-services/auth-service/.env
    environment:
      DB_URL: jdbc:mysql://db:3306/water_auth?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/

  property-service:
    build:
      context: ./micro-services
      dockerfile: property-service/Dockerfile
    container_name: property_service
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./micro-services/property-service/.env
    environment:
      DB_URL: jdbc:mysql://db:3306/water_property?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/

  waterconfig-service:
    build:
      context: ./micro-services
      dockerfile: waterconfig-service/Dockerfile
    container_name: waterconfig_service
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./micro-services/waterconfig-service/.env
    environment:
      DB_URL: jdbc:mysql://db:3306/water_config?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      PROPERTY_SERVICE_URL: http://property-service:8082
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/

  telemetry-service:
    build:
      context: ./micro-services
      dockerfile: telemetry-service/Dockerfile
    container_name: telemetry_service
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./micro-services/telemetry-service/.env
    environment:
      DB_URL: jdbc:mysql://db:3306/water_telemetry?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      PROPERTY_SERVICE_URL: http://property-service:8082
      WATERCONFIG_SERVICE_URL: http://waterconfig-service:8083
      AUTH_SERVICE_URL: http://auth-service:8081
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      IBM_MQ_CONNNAME: ibmmq(1414)
      SFTP_HOST: sftp
      SFTP_PORT: 22

  reporting-service:
    build:
      context: ./micro-services
      dockerfile: reporting-service/Dockerfile
    container_name: reporting_service
    ports:
      - "8085:8085"
    depends_on:
      - telemetry-service
      - auth-service
    env_file:
      - ./micro-services/reporting-service/.env
    environment:
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      TELEMETRY_SERVICE_URL: http://telemetry-service:8084
      AUTH_SERVICE_URL: http://auth-service:8081
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/
      KAFKA_SERVERS: kafka:29092


  discovery-service:
    build:
      context: ./micro-services
      dockerfile: discovery-service/Dockerfile
    container_name: discovery_service
    ports:
      - "8089:8089"

  gateway-service:
    build:
      context: ./micro-services
      dockerfile: gateway-service/Dockerfile
    container_name: gateway_service
    ports:
      - "8090:8090"
    depends_on:
      - discovery-service
    environment:
      EUREKA_SERVER_URL: http://discovery-service:8089/eureka/
      JWT_SECRET: 849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa
      AUTH_SERVICE_URL: http://auth-service:8081
      PROPERTY_SERVICE_URL: http://property-service:8082
      WATERCONFIG_SERVICE_URL: http://waterconfig-service:8083
      TELEMETRY_SERVICE_URL: http://telemetry-service:8084
      REPORTING_SERVICE_URL: http://reporting-service:8085

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    ports:
      - "8091:8084"
    depends_on:
      - gateway-service
  # prometheus:
  #   image: prom/prometheus:v2.50.1
  #   container_name: prometheus
  #   volumes:
  #     - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #   ports:
  #     - "9090:9090"
  #   restart: unless-stopped

  # grafana:
  #   image: grafana/grafana:10.4.1
  #   container_name: grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #     - GF_USERS_ALLOW_SIGN_UP=false
  #   volumes:
  #     - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
  #     - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
  #     - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
  #   restart: unless-stopped

  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   restart: unless-stopped
  #   user: "0"
  #   ports:
  #     - "9000:9000"
  #     - "9443:9443"
  #   volumes:
  #     - /run/user/1000/docker.sock:/var/run/docker.sock
  #     - portainer_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: local_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  sftp:
    image: atmoz/sftp:latest
    container_name: local_sftp
    ports:
      - "2222:22"
    command: sftpuser:password:1001::upload,export

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: local_ibmmq
    ports:
      - "1414:1414"
      - "9443:9443"
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: QM1

volumes:
  mysql_micro_data:
  portainer_data:
