server:
  port: 8089

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8089/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: false
