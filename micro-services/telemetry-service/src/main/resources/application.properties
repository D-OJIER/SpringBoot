spring.application.name=telemetry-service
spring.config.import=optional:file:.env[.properties]
server.port=8084

# Database — telemetry-service owns its own schema: water_telemetry
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/water_telemetry?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET}

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# External Service Feign Client URLs
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}
waterconfig-service.url=${WATERCONFIG_SERVICE_URL:http://localhost:8083}
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}
