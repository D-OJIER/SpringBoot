spring.application.name=telemetry-service
spring.config.import=optional:file:.env[.properties]
server.port=8084

# Database — telemetry-service owns its own schema: water_telemetry
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/water_telemetry?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# External Service Feign Client URLs
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}
waterconfig-service.url=${WATERCONFIG_SERVICE_URL:http://localhost:8083}
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# Eureka Registration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8089/eureka/}

# ==========================================
# IBM MQ Configuration
# ==========================================
# The Queue Manager defined in our docker-compose container
ibm.mq.queueManager=QM1
# Connection name pattern: host(port)
ibm.mq.connName=localhost(1414)
# Channel name for application connections
ibm.mq.channel=DEV.APP.SVRCONN
ibm.mq.user=admin
ibm.mq.password=admin

# ==========================================
# Kafka Configuration
# ==========================================
# Address of our local Kraft Kafka broker
spring.kafka.bootstrap-servers=localhost:9092
# Consumer group for parsing/saving telemetry data
spring.kafka.consumer.group-id=telemetry-group
# Read from the start of the stream if no offset exists
spring.kafka.consumer.auto-offset-reset=earliest

# ==========================================
# Custom Integration Properties
# ==========================================
integration.sftp.host=localhost
integration.sftp.port=2222
integration.sftp.user=sftpuser
integration.sftp.password=password
integration.sftp.directory=upload

# Queue name to use on IBM MQ
integration.mq.queue-name=DEV.QUEUE.1
# Topic name to publish to in Kafka
integration.kafka.topic=water-telemetry-logs

# Configuration Event Topic & Group
integration.kafka.config-topic=water-config-events
integration.kafka.config-group=telemetry-config-group

