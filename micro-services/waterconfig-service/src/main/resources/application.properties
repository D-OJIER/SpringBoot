spring.application.name=waterconfig-service
spring.config.import=optional:file:.env[.properties]
server.port=8083

# Database — waterconfig-service owns its own schema: water_config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/water_config?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never

# Property Service Feign Client URL
property-service.url=${PROPERTY_SERVICE_URL:http://localhost:8082}

# Eureka Registration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8089/eureka/}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.water-config=water-config-events

