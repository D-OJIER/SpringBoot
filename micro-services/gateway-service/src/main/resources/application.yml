server:
  port: 8090

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:8091"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://auth-service}
          predicates:
            - Path=/auth/**, /users/**
        - id: property-service
          uri: ${PROPERTY_SERVICE_URL:lb://property-service}
          predicates:
            - Path=/apartments/**, /apartment-types/**, /blocks/**
        - id: waterconfig-service
          uri: ${WATERCONFIG_SERVICE_URL:lb://waterconfig-service}
          predicates:
            - Path=/water-sources/**, /water-rates/**, /apartment-source-configs/**
        - id: telemetry-service
          uri: ${TELEMETRY_SERVICE_URL:lb://telemetry-service}
          predicates:
            - Path=/daily-logs/**
        - id: reporting-service
          uri: ${REPORTING_SERVICE_URL:lb://reporting-service}
          predicates:
            - Path=/dashboard/**, /monthly-summary/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8089/eureka/}

jwt:
  secret: ${JWT_SECRET:849864a7cc912ad511ed4f19569c1dc3e1b4519bb81059882cea44f51787c7aa}
